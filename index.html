<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CallTrace Pro - Phone Number Verification & Log Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --accent-blue: #2563eb;
            --accent-hover: #1d4ed8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; }
        .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 1.5rem; }
        header { text-align: center; margin-bottom: 1rem; }
        header h1 { font-size: 2.2rem; font-weight: 700; background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        header p { color: var(--text-muted); margin-top: 0.5rem; }
        .card { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.5rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }
        .input-group { display: flex; gap: 0.75rem; margin-top: 1rem; }
        input[type="text"], input[type="number"], select { flex: 1; background: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-main); padding: 0.85rem 1rem; border-radius: 8px; font-size: 1rem; outline: none; transition: border-color 0.2s; }
        input:focus, select:focus { border-color: var(--accent-blue); }
        button { background: var(--accent-blue); color: #fff; border: none; padding: 0.85rem 1.5rem; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.1s; }
        button:hover { background: var(--accent-hover); }
        button:active { transform: scale(0.98); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        @media (max-width: 640px) { .grid-2, .input-group { grid-template-columns: 1fr; flex-direction: column; } }
        .status-badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.85rem; font-weight: 500; text-transform: capitalize; }
        .badge-incoming { background: rgba(16, 185, 129, 0.2); color: var(--success-color); }
        .badge-outgoing { background: rgba(37, 99, 235, 0.2); color: #60a5fa; }
        .badge-missed { background: rgba(239, 68, 68, 0.2); color: var(--danger-color); }
        .badge-paystack { background: rgba(167, 139, 250, 0.2); color: #c084fc; font-size: 0.75rem; padding: 0.15rem 0.4rem; border-radius: 4px; margin-left: 0.4rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; text-align: left; }
        th, td { padding: 0.85rem; border-bottom: 1px solid var(--border-color); }
        th { color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; }
        tr:hover { background: rgba(255, 255, 255, 0.02); }
        .empty-state { text-align: center; padding: 2.5rem; color: var(--text-muted); }
        .loader { display: none; border: 3px solid var(--border-color); border-top: 3px solid var(--accent-blue); border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>CallTrace Pro</h1>
        <p>Real-time Paystack Verification & Firebase Cloud Logs</p>
    </header>

    <!-- Lookup Form -->
    <div class="card">
        <h3>Lookup Call History</h3>
        <p style="font-size: 0.9rem; color: var(--text-muted); margin-top: 0.2rem;">
            Enter a target phone number to fetch activity logs.
        </p>
        <div class="input-group">
            <input type="text" id="targetPhoneInput" placeholder="e.g. 0247946116" value="0247946116">
            <button onclick="handleFetchLogs()">Search Logs</button>
        </div>
    </div>

    <!-- Add New Record Form -->
    <div class="card">
        <h3>Log New Call Record</h3>
        <form id="addLogForm" onsubmit="handleCreateLog(event)" style="margin-top: 1rem; display: flex; flex-direction: column; gap: 0.8rem;">
            <div class="grid-2">
                <input type="text" id="newTargetPhone" placeholder="Target Phone (e.g. 0247946116)" required>
                <input type="text" id="newContactName" placeholder="Contact Name (Auto-resolved via Paystack if empty)">
            </div>
            <div class="grid-2">
                <select id="newCallType" required>
                    <option value="incoming">Incoming</option>
                    <option value="outgoing">Outgoing</option>
                    <option value="missed">Missed</option>
                </select>
                <input type="number" id="newDuration" placeholder="Duration (seconds)" min="0" value="60" required>
            </div>
            <button type="submit" style="align-self: flex-start;">Add Record to Cloud</button>
        </form>
    </div>

    <!-- Logs Display Table -->
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3>Call Logs History</h3>
            <span id="recordCount" style="font-size: 0.85rem; color: var(--text-muted);">Fetching...</span>
        </div>

        <div id="loadingSpinner" class="loader" style="margin-top: 1.5rem;"></div>

        <div style="overflow-x: auto;">
            <table id="logsTable">
                <thead>
                    <tr>
                        <th>Contact</th>
                        <th>Type</th>
                        <th>Carrier</th>
                        <th>Duration</th>
                        <th>Timestamp</th>
                    </tr>
                </thead>
                <tbody id="logsTableBody">
                    <tr>
                        <td colspan="5" class="empty-state">Loading logs...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const CONFIG = {
        API_BASE_URL: '/api'
    };

    async function handleFetchLogs() {
        const phone = document.getElementById('targetPhoneInput').value.trim();
        const tableBody = document.getElementById('logsTableBody');
        const spinner = document.getElementById('loadingSpinner');
        const recordCount = document.getElementById('recordCount');

        tableBody.innerHTML = '';
        spinner.style.display = 'block';

        try {
            const url = `${CONFIG.API_BASE_URL}/call-logs?phoneNumber=${encodeURIComponent(phone)}`;
            const response = await fetch(url, {
                method: 'GET',
                headers: { 'Accept': 'application/json' }
            });

            const data = await response.json();

            spinner.style.display = 'none';

            if (!data || !data.logs || data.logs.length === 0) {
                recordCount.innerText = '0 records found';
                tableBody.innerHTML = `<tr><td colspan="5" class="empty-state">No call logs found for ${escapeHtml(phone)}.</td></tr>`;
                return;
            }

            recordCount.innerText = `${data.logs.length} record(s) found`;
            tableBody.innerHTML = data.logs.map(log => `
                <tr>
                    <td>
                        <strong>${escapeHtml(log.contactName)}</strong>
                        ${log.paystackVerified ? '<span class="badge-paystack">Paystack Verified</span>' : ''}
                        <br><small style="color: var(--text-muted);">${escapeHtml(log.phoneNumber)}</small>
                    </td>
                    <td><span class="status-badge badge-${log.type}">${escapeHtml(log.type)}</span></td>
                    <td>${escapeHtml(log.carrier)}</td>
                    <td>${formatDuration(log.durationSec)}</td>
                    <td>${new Date(log.timestamp).toLocaleString()}</td>
                </tr>
            `).join('');

        } catch (error) {
            spinner.style.display = 'none';
            recordCount.innerText = 'Error loading logs';
            tableBody.innerHTML = `<tr><td colspan="5" class="empty-state" style="color: var(--danger-color);">Could not connect to backend server.</td></tr>`;
        }
    }

    async function handleCreateLog(event) {
        event.preventDefault();
        
        const targetPhone = document.getElementById('newTargetPhone').value.trim();
        const contactName = document.getElementById('newContactName').value.trim();
        const type = document.getElementById('newCallType').value;
        const durationSec = document.getElementById('newDuration').value;

        try {
            const response = await fetch(`${CONFIG.API_BASE_URL}/call-logs`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    targetPhone,
                    contactName,
                    phoneNumber: targetPhone,
                    type,
                    durationSec,
                    timestamp: new Date().toISOString()
                })
            });

            const data = await response.json();

            if (response.ok) {
                alert('Record saved successfully!');
                document.getElementById('addLogForm').reset();
                document.getElementById('targetPhoneInput').value = targetPhone;
                handleFetchLogs();
            } else {
                alert('Error saving record: ' + (data.message || 'Unknown error'));
            }

        } catch (error) {
            alert('Failed to connect to backend server.');
        }
    }

    function formatDuration(seconds) {
        if (!seconds || seconds <= 0) return '0s';
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return m > 0 ? `${m}m ${s}s` : `${s}s`;
    }

    function escapeHtml(str) {
        return (str || '').replace(/[&<>"']/g, function(m) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
        });
    }

    // Automatically load logs when page finishes loading
    window.addEventListener('DOMContentLoaded', () => {
        handleFetchLogs();
    });
</script>
</body>
</html>
